<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Runnercode — اجراکننده کد HTML</title>
<meta name="description" content="Runnercode یک ابزار آنلاین برای نوشتن و اجرای زنده‌ی کد HTML، CSS و JavaScript است — بدون نیاز به تنظیمات، در یک فایل واحد.">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>

<style>
  :root {
    --bg: #121216;
    --panel: #1a1a20;
    --border: #2a2a34;
    --text: #e2e8f0;
    --text-dim: #8b8d9b;
    --accent: #f0a83c;
    --mono: 'JetBrains Mono', Consolas, monospace;
    --sans: system-ui, -apple-system, sans-serif;
  }
  body.light {
    --bg: #f4f4f7;
    --panel: #ffffff;
    --border: #e0e0e6;
    --text: #1c1c22;
    --text-dim: #6b6b76;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    height: calc(var(--vh, 1vh) * 100);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background .2s, color .2s;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 6px;
    height: 48px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    width: 100%;
  }

  .brand-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-weight: 600;
    font-size: 11px;
    font-family: var(--sans);
    cursor: pointer;
    padding: 0 3px;
    flex-shrink: 0;
  }
  .brand-btn:hover { color: var(--accent); }

  .spacer { flex: 1; min-width: 2px; }

  .actions { 
    display: flex; 
    gap: 3px; 
    align-items: center; 
    flex-shrink: 0; 
  }

  .btn {
    height: 30px;
    padding: 0 6px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-family: var(--sans);
    white-space: nowrap;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.icon-only { width: 30px; padding: 0; }
  .btn.danger { color: #ef4444; border-color: #3a2226; }
  .btn.danger:hover { background: #ef4444; color: #fff; border-color: #ef4444; }
  
  .btn.support {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  .btn.support:hover { background: var(--accent); color: #000; }

  @media (max-width: 760px) {
    .spacer { display: none; }
    .actions { display: contents; }
    .brand-btn { flex: 1; }
    .btn { flex: 1; }
    .btn.icon-only { width: auto; }
  }

  @media (max-width: 480px) {
    .topbar { padding: 0 4px; gap: 2px; }
    .actions { gap: 2px; }
    .btn { padding: 0 4px; font-size: 10.5px; height: 28px; }
    .brand-btn { font-size: 10.5px; padding: 0 2px; }
  }

  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 0;
  }

  .pane {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-inline-start: 1px solid var(--border);
  }
  .pane:first-child { border-inline-start: none; }

  .tabbar { display: none; }
  @media (max-width: 760px) {
    .tabbar {
      display: flex;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }
    .tabbar button {
      flex: 1;
      height: 38px;
      background: var(--panel);
      color: var(--text-dim);
      border: none;
      border-bottom: 2px solid transparent;
      font-family: var(--sans);
      font-size: 12.5px;
      cursor: pointer;
    }
    .tabbar button.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .main { grid-template-columns: 1fr; }
    .pane { display: none; border-inline-start: none; }
    .pane.active { display: flex; }
  }

  .pane-head {
    height: 30px;
    flex-shrink: 0;
    padding: 0 10px;
    display: flex;
    align-items: center;
    font-size: 11px;
    color: var(--text-dim);
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    font-family: var(--mono);
  }
  @media (max-width: 760px) {
    .pane-head { display: none; }
  }

  .editor-wrap {
    flex: 1;
    min-height: 0;
  }
  .CodeMirror {
    height: 100% !important;
    background: var(--bg) !important;
    color: var(--text) !important;
    font-family: var(--mono);
    font-size: 13px;
    -webkit-user-select: none;
    user-select: none;
  }
  .CodeMirror pre.CodeMirror-line,
  .CodeMirror pre.CodeMirror-line-like {
    -webkit-user-select: text;
    user-select: text;
  }

  .preview-wrap {
    flex: 1;
    background: #fff;
    min-height: 0;
    position: relative;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
  .empty-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #b8b8c2;
    font-size: 13px;
    pointer-events: none;
    font-family: var(--sans);
  }

  .preview-wrap.fs-active {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #fff;
  }

  .preview-divider {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: #fff;
    z-index: 3;
    pointer-events: none;
  }

  .fs-btn {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 32px;
    height: 32px;
    border-radius: 6px;
    border: none;
    background: rgba(0,0,0,.55);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }
  .fs-btn:hover { background: rgba(0,0,0,.8); }

  #fileInput { display: none; }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 999;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    max-width: 420px;
    width: 100%;
    padding: 20px;
  }
  .modal-box h2 { font-size: 15px; margin-bottom: 8px; }
  .modal-box p { font-size: 13px; color: var(--text-dim); line-height: 1.8; margin-bottom: 16px; }
  .modal-box .btn { width: 100%; }
</style>
</head>
<body>

  <div class="topbar">
    <button class="brand-btn" id="aboutBtn">درباره</button>
    <div class="spacer"></div>
    <div class="actions">
      <button class="btn" id="importBtn">آپلود</button>
      <button class="btn" id="exportBtn">دانلود</button>
      <button class="btn" id="pasteBtn">جای‌گذاری</button>
      <button class="btn" id="copyBtn">کپی</button>
      <button class="btn danger" id="clearBtn">پاک‌سازی</button>
      <button class="btn icon-only" id="themeBtn" title="حالت روشن/تیره">🌙</button>
      <a class="btn support" id="supportBtn" href="https://daramet.com/Miladvpanalyse" target="_blank" rel="noopener">حمایت از ما</a>
    </div>
    <input type="file" id="fileInput" accept=".html,.htm,.txt">
  </div>

  <div class="modal-overlay" id="aboutModal">
    <div class="modal-box">
      <h2>درباره‌ی Runnercode</h2>
      <p>این ابزار برای نوشتن و اجرای زنده‌ی کد HTML طراحی شده. کد رو در تب «کد» بنویس، نتیجه رو در تب «پیش‌نمایش» ببین، و در پایان با دکمه‌ی «دانلود» فایلت رو ذخیره کن.</p>
      <p><b style="color:var(--text);">زبان‌های پشتیبانی‌شده:</b> HTML، CSS، JavaScript</p>
      <button class="btn" id="closeAbout">بستن</button>
    </div>
  </div>

  <div class="tabbar">
    <button class="tab-btn active" data-pane="0">کد</button>
    <button class="tab-btn" data-pane="1">پیش‌نمایش</button>
  </div>

  <div class="main">
    <div class="pane active" data-pane="0">
      <div class="pane-head">کد HTML</div>
      <div class="editor-wrap">
        <textarea id="code"></textarea>
      </div>
    </div>
    <div class="pane" data-pane="1">
      <div class="pane-head">پیش‌نمایش زنده</div>
      <div class="preview-wrap" id="previewWrap">
        <div class="preview-divider" id="previewDivider"></div>
        <iframe id="preview"></iframe>
        <div class="empty-hint" id="emptyHint">کد بنویسید تا این‌جا رندر شود</div>
        <button class="fs-btn" id="fsBtn" title="نمایش تمام‌صفحه">⛶</button>
      </div>
    </div>
  </div>

<script>
  const iframe = document.getElementById('preview');
  const previewWrap = document.getElementById('previewWrap');
  const previewDivider = document.getElementById('previewDivider');
  const emptyHint = document.getElementById('emptyHint');
  const body = document.body;

  const aboutModal = document.getElementById('aboutModal');
  document.getElementById('aboutBtn').addEventListener('click', () => aboutModal.classList.add('open'));
  document.getElementById('closeAbout').addEventListener('click', () => aboutModal.classList.remove('open'));
  aboutModal.addEventListener('click', e => { if (e.target === aboutModal) aboutModal.classList.remove('open'); });

  function setViewportHeight() {
    document.documentElement.style.setProperty('--vh', window.innerHeight * 0.01 + 'px');
  }
  setViewportHeight();
  window.addEventListener('resize', setViewportHeight);

  const tabBtns = document.querySelectorAll('.tab-btn');
  const panes = document.querySelectorAll('.pane');
  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      tabBtns.forEach(b => b.classList.remove('active'));
      panes.forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.querySelector('.pane[data-pane="' + btn.dataset.pane + '"]').classList.add('active');
      if (btn.dataset.pane === '0') cm.refresh();
      else updatePreview();
    });
  });

  const savedCode = localStorage.getItem('runnercode_data') || '';
  const cm = CodeMirror.fromTextArea(document.getElementById('code'), {
    lineNumbers: true,
    mode: 'htmlmixed',
    tabSize: 2,
    lineWrapping: true
  });
  if (savedCode) cm.setValue(savedCode);

  function updatePreview() {
    const code = cm.getValue();
    emptyHint.style.display = code.trim() ? 'none' : 'flex';
    localStorage.setItem('runnercode_data', code);

    const pWidth = previewWrap.clientWidth || window.innerWidth;
    const pHeight = previewWrap.clientHeight || window.innerHeight;

    const mobileFixScript = `
      <script>
        window.innerWidth = ${pWidth};
        window.innerHeight = ${pHeight};
      <\/script>
    `;

    const doc = iframe.contentDocument || iframe.contentWindow.document;
    doc.open();
    doc.write(mobileFixScript + code);
    doc.close();

    setTimeout(() => {
      let isLight = true;
      try {
        const bg = getComputedStyle(doc.body).backgroundColor;
        const m = bg.match(/\d+(\.\d+)?/g);
        if (m && m.length >= 3 && !(m[3] === '0')) {
          const [r, g, b] = m;
          const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
          isLight = luminance > 0.6;
        }
      } catch (e) {}
      previewDivider.style.background = isLight ? '#000' : '#fff';
    }, 30);
  }

  cm.on('change', updatePreview);
  updatePreview();

  const fsBtn = document.getElementById('fsBtn');
  fsBtn.addEventListener('click', () => {
    previewWrap.classList.toggle('fs-active');
    fsBtn.textContent = previewWrap.classList.contains('fs-active') ? '✕' : '⛶';
    setTimeout(updatePreview, 100);
  });

  document.getElementById('exportBtn').addEventListener('click', () => {
    const code = cm.getValue();
    if (!code.trim()) return;
    const blob = new Blob([code], { type: 'text/html;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'index.html';
    link.click();
    URL.revokeObjectURL(link.href);
  });

  const copyBtn = document.getElementById('copyBtn');
  copyBtn.addEventListener('click', async () => {
    const code = cm.getValue();
    if (!code.trim()) return;
    try {
      await navigator.clipboard.writeText(code);
      const original = copyBtn.textContent;
      copyBtn.textContent = 'کپی شد ✓';
      setTimeout(() => { copyBtn.textContent = original; }, 1200);
    } catch (e) {
      alert('کپی خودکار پشتیبانی نشد؛ به‌صورت دستی کد رو انتخاب و کپی کن.');
    }
  });

  document.getElementById('pasteBtn').addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (text) cm.setValue(text);
    } catch (e) {
      alert('دسترسی به کلیپ‌بورد ممکن نشد؛ می‌تونی مستقیم توی کادر کد پیست کنی.');
    }
  });

  const fileInput = document.getElementById('fileInput');
  document.getElementById('importBtn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => cm.setValue(ev.target.result);
    reader.readAsText(file);
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    cm.setValue('');
    localStorage.removeItem('runnercode_data');
  });

  const themeBtn = document.getElementById('themeBtn');
  themeBtn.addEventListener('click', () => {
    body.classList.toggle('light');
    themeBtn.textContent = body.classList.contains('light') ? '☀' : '🌙';
    cm.refresh();
  });
</script>

</body>
</html>
